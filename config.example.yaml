# ses-smtp-proxy sample configuration.
#
# Search order:
#   1. --config <path> flag
#   2. config.yaml in the same directory as the executable
#      (typically C:\Program Files\ses-smtp-proxy\config.yaml)
#
# Tip: most of the AWS-side values below can be generated automatically
# by deploying cloudformation/template.yaml and pulling the ConfigYaml
# stack output:
#
#   aws cloudformation describe-stacks --stack-name ses-smtp-proxy \
#     --query "Stacks[0].Outputs[?OutputKey=='ConfigYaml'].OutputValue" \
#     --output text > "C:\Program Files\ses-smtp-proxy\config.yaml"

aws:
  region: us-east-1
  # Omit accessKeyId / secretAccessKey to use the default AWS credential
  # chain (environment variables, shared credentials file, IAM role, etc.).
  accessKeyId: ""
  secretAccessKey: ""
  # Optional named profile from %USERPROFILE%\.aws\credentials.
  profile: ""

inbound:
  # SQS queue subscribed to the SNS topic that SES publishes receipt
  # notifications to.
  sqsQueueUrl: "https://sqs.us-east-1.amazonaws.com/123456789012/ses-smtp-proxy-inbound"
  # Optional: name of the S3 bucket emails are stored in. When set, messages
  # referencing any other bucket are rejected as a safety check. Leave empty
  # to trust the bucket name embedded in the SES notification.
  s3Bucket: ""
  # SQS long-poll wait, in seconds (max 20).
  pollWaitSeconds: 20
  # Maximum concurrent message handlers.
  maxConcurrent: 4
  # SQS visibility timeout in seconds. Should be greater than the worst-case
  # time it takes to fetch a message from S3 and relay it to Exchange.
  visibilityTimeoutSeconds: 300

  exchange:
    host: 127.0.0.1
    port: 25
    # Issue STARTTLS after EHLO. Recommended.
    starttls: true
    # Set to true if the Exchange server presents a self-signed certificate
    # that is not trusted by the local machine certificate store.
    insecureSkipVerify: false
    # HELO/EHLO name advertised to Exchange.
    heloDomain: ses-smtp-proxy.local
    # Optional SMTP AUTH against Exchange (most internal relays do not need
    # this; an IP-based receive connector is the typical setup).
    username: ""
    password: ""

outbound:
  # Local SMTP listener Exchange's Send Connector relays outbound mail to.
  listen: "0.0.0.0:2525"
  # Only connections from these CIDRs are accepted. Add the source IP of
  # the Exchange Send Connector here.
  allowedCidrs:
    - 127.0.0.1/32
  # Maximum DATA size accepted, in bytes. SES caps inbound messages at 40 MiB.
  maxMessageBytes: 41943040
  # Optional STARTTLS for the Exchange -> proxy hop. Leave certFile/keyFile
  # empty to disable (plaintext is acceptable on a trusted localhost link).
  tls:
    certFile: ""
    keyFile: ""

logging:
  # debug | info | warn | error
  level: info
  # When file is empty, logs go to the Windows Event Log under source
  # "ses-smtp-proxy". When set, logs are written to the file and rotated
  # by size.
  file: ""
  maxSizeMB: 50
  maxBackups: 5
  maxAgeDays: 30
